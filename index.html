<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A 1979 Z-machine text adventure resurrected behind an LLM front end."
    />
    <title>Z-Machine Resurrection</title>
    <script type="module" crossorigin src="./assets/index-DGEZbEn8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DWFDonbp.css">
  </head>
  <body>
    <main class="shell" aria-label="Z-machine terminal">
      <header class="shell__header">
        <span class="shell__title">Z-MACHINE // RESURRECTION</span>
        <span class="shell__status" id="status">state: deterministic</span>
      </header>
      <section
        class="shell__screen"
        id="screen"
        role="log"
        aria-live="polite"
        aria-label="Transcript"
      ></section>
      <form class="shell__prompt" id="prompt-form" autocomplete="off">
        <label class="shell__prompt-label" for="command">&gt;</label>
        <input
          class="shell__input"
          id="command"
          name="command"
          type="text"
          spellcheck="false"
          autocapitalize="off"
          autofocus
          aria-label="Command"
        />
      </form>
    </main>
  </body>
</html>
