<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A 1979 Z-machine text adventure resurrected behind an LLM front end."
    />
    <title>Z-Machine Resurrection</title>
  </head>
  <body>
    <main class="shell" id="shell" aria-label="Z-machine terminal">
      <header class="shell__header">
        <div class="shell__row shell__row--brand">
          <h1 class="shell__title" id="title">Z-MACHINE // RESURRECTION</h1>
          <p class="shell__subtitle" id="subtitle">
            A text adventure where the model cannot lie about the world.
          </p>
        </div>
        <div class="shell__row shell__row--controls">
          <span class="shell__goal" id="goal">Goal: reach the vault</span>
          <div class="shell__keys">
            <button
              class="shell__key"
              id="locale-toggle"
              type="button"
              lang="zh"
              aria-label="Switch to Chinese"
            >
              中文
            </button>
            <button
              class="shell__key"
              id="help-toggle"
              type="button"
              aria-controls="help"
              aria-expanded="false"
              aria-label="Help"
            >
              ?
            </button>
          </div>
        </div>
      </header>
      <section
        class="shell__screen"
        id="screen"
        role="log"
        aria-live="polite"
        aria-label="Transcript"
      ></section>
      <aside class="shell__help" id="help" hidden aria-labelledby="help-title">
        <div class="shell__help-head">
          <h2 class="shell__help-title" id="help-title">Command reference</h2>
          <button class="shell__key shell__key--paper" id="help-close" type="button">
            Close
          </button>
        </div>
        <div class="shell__help-body" id="help-body"></div>
      </aside>
      <div class="shell__status" id="status">
        Cell · 0 moves · goal: reach the vault · input: rule parser
      </div>
      <form class="shell__prompt" id="prompt-form" autocomplete="off">
        <label class="shell__prompt-label" for="command">&gt;</label>
        <div class="shell__input-wrap" id="input-wrap">
          <span class="shell__measure" id="input-measure" aria-hidden="true"></span>
          <input
            class="shell__input"
            id="command"
            name="command"
            type="text"
            spellcheck="false"
            autocapitalize="off"
            autofocus
            aria-label="Command"
          />
          <span class="shell__cursor" id="input-cursor" aria-hidden="true"></span>
        </div>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
